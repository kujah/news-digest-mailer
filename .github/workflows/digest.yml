name: Send news digest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # 04:00 Korea time on the next calendar day

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Send digest when configured
        if: ${{ vars.DIGEST_ENABLED == 'true' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python digest.py --config sources.json

